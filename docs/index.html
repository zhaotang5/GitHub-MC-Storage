<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>GitHub 网盘 v0.2.2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/oreui-web@0.0.1/dist/styles.css">
<script type="module">
  import "https://cdn.jsdelivr.net/npm/oreui-web@0.0.1/+esm";
</script>
<style>
  html, body {
    background: #000;
    color: #eee;
    color-scheme: dark;
    margin: 0;
    min-height: 100vh;
  }
  body { padding-bottom: 40px; }

  #nav { position: sticky; top: 0; z-index: 60; background: #000; }
  #nav:empty { display: none; }
  ore-navbar { width: 100%; }

  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 16px 0;
    box-sizing: border-box;
  }

  .center-box { max-width: 430px; margin: 7vh auto 0; }

  .auth {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 392px;
    gap: 16px;
    align-items: stretch;
    max-width: 1040px;
    min-height: calc(100vh - 130px);
    margin: 0 auto;
    padding: 22px 16px 0;
    box-sizing: border-box;
  }
  .auth-hero {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    min-height: 430px;
    background: #0a0d09;
    border: 2px solid rgba(255, 255, 255, 0.12);
    box-sizing: border-box;
  }
  .hero-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-art {
    position: absolute;
    inset: 0;
    background-color: #0a0d09;
    background-image:
      linear-gradient(rgba(120, 190, 90, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 190, 90, 0.08) 1px, transparent 1px),
      radial-gradient(120% 95% at 18% 8%, rgba(60, 133, 39, 0.32), transparent 62%),
      radial-gradient(95% 85% at 88% 92%, rgba(122, 167, 255, 0.18), transparent 66%);
    background-size: 32px 32px, 32px 32px, 100% 100%, 100% 100%;
  }
  .hero-caption {
    position: relative;
    z-index: 2;
    width: 100%;
    box-sizing: border-box;
    padding: 24px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0) 80%);
  }
  .hero-mark { display: flex; gap: 4px; margin-bottom: 12px; }
  .hero-mark i { display: block; width: 13px; height: 13px; background: #3c8527; }
  .hero-mark i:nth-child(2) { background: #57b23a; }
  .hero-mark i:nth-child(3) { background: #7aa7ff; }
  .hero-mark i:nth-child(4) { background: #2f6b1e; }
  .hero-title { font-size: 27px; font-weight: 700; color: #fff; line-height: 1.25; }
  .hero-sub { font-size: 13px; opacity: 0.72; margin-top: 6px; }
  .auth-panel { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .auth-panel footer { margin-top: 18px; }

  .set-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .avatar.big { width: 52px; height: 52px; margin-right: 0; font-size: 22px; }
  .set-info { flex: 1 1 140px; min-width: 0; }
  .set-name { font-size: 16px; margin-bottom: 2px; word-break: break-all; }
  .set-sep { height: 2px; background: rgba(255, 255, 255, 0.1); margin: 4px 0; }
  .set-label { font-size: 13px; color: #a9a9a9; }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 0 14px;
  }
  .page-head h1 { font-size: 22px; margin: 0; }
  .muted { opacity: 0.65; font-size: 13px; }

  .ore-card-body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    box-sizing: border-box;
    width: 100%;
    padding: 18px;
  }
  .ore-card-caption { display: block; min-width: 0; }
  .ore-card-title, .ore-card-description {
    display: block;
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
    -webkit-line-clamp: unset;
  }
  .ore-card-caption .ore-card-title { font-size: 18px; }

  ore-textfield { display: block; width: 100%; }
  ore-button { vertical-align: middle; }
  ore-tag { display: inline-block; }

  .btn-col { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .gap { height: 14px; }

  .crumb { font-size: 14px; word-break: break-all; line-height: 1.7; }
  .crumb a { color: #7aa7ff; cursor: pointer; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    align-items: center;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .toolbar > * { flex: 0 0 auto; }
  .toolbar::-webkit-scrollbar { height: 6px; }
  .toolbar::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 3px; }

  .new-drop { display: inline-block; }

  .table-wrap { width: 100%; overflow-x: auto; }
  table.files {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    min-width: 520px;
  }
  table.files th, table.files td {
    text-align: left;
    padding: 11px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    vertical-align: middle;
    line-height: 1.4;
  }
  table.files th {
    color: #a9a9a9;
    font-weight: normal;
    font-size: 13px;
    white-space: nowrap;
    padding-top: 6px;
    padding-bottom: 6px;
  }
  table.files .c-check { width: 40px; }
  table.files .c-check ore-checkbox { display: inline-block; vertical-align: middle; }
  table.files .c-size { width: 110px; white-space: nowrap; }
  table.files .c-act { white-space: nowrap; text-align: right; }
  table.files td.c-name { cursor: pointer; }
  table.files td.c-name:hover .fname { color: #7aa7ff; }
  .fname { word-break: break-all; }
  .ico-dir, .ico-file { display: inline-block; width: 18px; opacity: 0.75; }
  .ico-dir { color: #ffd953; }

  .link-btn {
    background: none;
    border: none;
    color: #7aa7ff;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    font-family: inherit;
    line-height: 1.4;
  }
  .link-btn.danger { color: #f47e7e; }
  .link-btn:hover { text-decoration: underline; }
  .token-line { margin-top: 2px; }

  .batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    padding-top: 12px;
  }

  .status { font-size: 13px; }
  .empty-tip { text-align: center; padding: 34px 0; opacity: 0.65; }
  .load-block {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px 0;
    opacity: 0.85;
    font-size: 14px;
  }
  .load-block .spin { font-size: 20px; display: inline-flex; }
  ore-spinner { display: inline-block; }

  footer { text-align: center; opacity: 0.55; font-size: 12px; margin-top: 26px; }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin-right: 7px;
    background: #3c8527;
    color: #fff;
    font-size: 13px;
    overflow: hidden;
    vertical-align: middle;
  }
  .avatar.small { width: 22px; height: 22px; font-size: 12px; margin-right: 6px; }
  .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .uname { display: inline-block; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .user-cell { display: inline-flex; align-items: center; }

  .user-drop { display: inline-block; }
  .user-drop .ore-dropdown-trigger {
    --ore-button-unit: 1.5px;
    white-space: nowrap;
  }
  .ore-navbar-start { padding-left: 8px; }

  .modal-body {
    padding: 0 22px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    max-height: 62vh;
    overflow-y: auto;
  }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 22px 18px;
  }
  .modal-actions > ore-button { width: 100%; }
  .modal-text { margin: 0; font-size: 14px; line-height: 1.7; opacity: 0.9; }
  .hist-wrap { display: block; }
  .hist-acc { width: 100%; margin-bottom: 2px; }
  ore-accordion .ore-accordion-content { font-size: 13px; line-height: 1.7; padding: 8px 14px 12px; }
  ore-accordion .ore-accordion-content p { margin: 4px 0 0; opacity: 0.85; }

  @media (max-width: 860px) {
    .auth {
      grid-template-columns: 1fr;
      max-width: 520px;
      min-height: 0;
    }
    .auth-hero { min-height: 168px; }
    .hero-caption { padding: 16px; }
    .hero-title { font-size: 20px; }
    .hero-sub { font-size: 12px; }
    .auth-panel { justify-content: flex-start; }
  }

  @media (max-width: 600px) {
    #app { padding: 14px 10px 0; }
    .page-head h1 { font-size: 19px; }
    .center-box { margin: 2vh auto 0; }
    .auth { padding: 12px 10px 0; gap: 12px; }
    .ore-card-body { padding: 13px; gap: 10px; }
    table.files { font-size: 14px; min-width: 470px; }
    table.files th, table.files td { padding: 9px 6px; }
    .modal-body { padding: 0 16px 4px; max-height: 58vh; }
    .ore-navbar-start { display: none; }
    .ore-navbar-title { font-size: 14px; }
    .modal-actions { padding: 12px 16px 16px; }
  }
</style>
</head>
<body>
<div id="nav"></div>
<div id="app"></div>
<input type="file" id="filePicker" multiple style="display:none">
<input type="file" id="avatarPicker" accept="image/*" style="display:none">
<script src="app.js?v=0.2.2"></script>
</body>
</html>
