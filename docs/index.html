<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>GitHub 网盘 v0.2.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/oreui-web@0.0.1/dist/styles.css">
<script type="module">
  import "https://cdn.jsdelivr.net/npm/oreui-web@0.0.1/+esm";
</script>
<style>
  html, body {
    background: #000;
    color: #eee;
    color-scheme: dark;
    margin: 0;
    min-height: 100vh;
  }
  body { padding-bottom: 40px; }

  #nav { position: sticky; top: 0; z-index: 60; }
  #nav:empty { display: none; }
  ore-navbar { display: block; width: 100%; }

  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 16px 0;
    box-sizing: border-box;
  }

  .center-box { max-width: 430px; margin: 7vh auto 0; }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 0 14px;
  }
  .page-head h1 { font-size: 22px; margin: 0; }
  .muted { opacity: 0.65; font-size: 13px; }

  .ore-card-body {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    box-sizing: border-box;
    width: 100%;
    padding: 18px;
  }
  .ore-card-caption { display: block; min-width: 0; }
  .ore-card-title, .ore-card-description {
    display: block;
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
    -webkit-line-clamp: unset;
  }
  .ore-card-caption .ore-card-title { font-size: 18px; }

  ore-textfield { display: block; width: 100%; }
  ore-button { vertical-align: middle; }
  ore-tag { display: inline-block; }

  .btn-col { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .gap { height: 14px; }

  .crumb { font-size: 14px; word-break: break-all; line-height: 1.7; }
  .crumb a { color: #7aa7ff; cursor: pointer; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }

  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    align-items: center;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .toolbar > * { flex: 0 0 auto; }
  .toolbar::-webkit-scrollbar { height: 6px; }
  .toolbar::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 3px; }

  .new-drop { display: inline-block; }
  .new-label { display: inline-block; line-height: 1.25; }

  .table-wrap { width: 100%; overflow-x: auto; }
  table.files {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
    min-width: 520px;
  }
  table.files th, table.files td {
    text-align: left;
    padding: 11px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    vertical-align: middle;
    line-height: 1.4;
  }
  table.files th {
    color: #a9a9a9;
    font-weight: normal;
    font-size: 13px;
    white-space: nowrap;
    padding-top: 6px;
    padding-bottom: 6px;
  }
  table.files .c-check { width: 40px; }
  table.files .c-check ore-checkbox { display: inline-block; vertical-align: middle; }
  table.files .c-size { width: 110px; white-space: nowrap; }
  table.files .c-act { width: 130px; white-space: nowrap; text-align: right; }
  table.files td.c-name { cursor: pointer; }
  table.files td.c-name:hover .fname { color: #7aa7ff; }
  .fname { word-break: break-all; }
  .ico-dir, .ico-file { display: inline-block; width: 18px; opacity: 0.75; }
  .ico-dir { color: #ffd953; }

  .link-btn {
    background: none;
    border: none;
    color: #7aa7ff;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 6px;
    font-family: inherit;
    line-height: 1.4;
  }
  .link-btn.danger { color: #f47e7e; }
  .link-btn:hover { text-decoration: underline; }
  .token-line { margin-top: 2px; }

  .batch-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 2px solid rgba(255, 255, 255, 0.12);
    padding-top: 12px;
  }

  .status { font-size: 13px; }
  .empty-tip { text-align: center; padding: 34px 0; opacity: 0.65; }
  .load-block {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px 0;
    opacity: 0.85;
    font-size: 14px;
  }
  .load-block .spin { font-size: 20px; display: inline-flex; }
  ore-spinner { display: inline-block; }

  footer { text-align: center; opacity: 0.55; font-size: 12px; margin-top: 26px; }

  .avatar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin-right: 8px;
    background: #3c8527;
    color: #fff;
    font-size: 14px;
    overflow: hidden;
    vertical-align: middle;
  }
  .avatar.small { width: 22px; height: 22px; font-size: 12px; margin-right: 6px; }
  .avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .uname { display: inline-block; line-height: 1.25; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .user-cell { display: inline-flex; align-items: center; }

  .user-drop { display: inline-block; }
  .ore-navbar-action-label { line-height: 1.25; }

  .modal-body {
    padding: 0 22px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-sizing: border-box;
    min-width: min(78vw, 380px);
  }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 14px 22px 18px;
  }
  .modal-actions > ore-button { width: 100%; }
  .modal-text { margin: 0; font-size: 14px; line-height: 1.7; opacity: 0.9; }
  .hist-wrap { max-height: 52vh; overflow-y: auto; }
  .hist { padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 13px; }
  .hist:last-child { border-bottom: none; }
  .hist b { color: #86d562; font-size: 14px; }
  .hist p { margin: 3px 0 0; opacity: 0.82; line-height: 1.6; }

  @media (max-width: 600px) {
    #app { padding: 14px 10px 0; }
    .page-head h1 { font-size: 19px; }
    .center-box { margin: 2vh auto 0; }
    .ore-card-body { padding: 13px; gap: 10px; }
    table.files { font-size: 14px; min-width: 470px; }
    table.files th, table.files td { padding: 9px 6px; }
    .modal-body { min-width: auto; padding: 0 16px 4px; }
    .modal-actions { padding: 12px 16px 16px; }
  }
</style>
</head>
<body>
<div id="nav"></div>
<div id="app"></div>
<input type="file" id="filePicker" multiple style="display:none">
<input type="file" id="avatarPicker" accept="image/*" style="display:none">
<script src="app.js?v=0.2.0"></script>
</body>
</html>
